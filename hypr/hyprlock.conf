general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.0117
    contrast = 0.95
    brightness = 0.82
    vibrancy = 0.18
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.92)
    font_size = 76
    font_family = SF Pro Display
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(255, 255, 255, 0.82)
    font_size = 18
    font_family = SF Pro Text
    position = 0, 82
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 54
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.18
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.48)
    inner_color = rgba(246, 247, 249, 0.72)
    font_color = rgba(29, 29, 31, 0.92)
    fade_on_empty = false
    placeholder_text = <span foreground="##1d1d1f99">Password</span>
    hide_input = false
    check_color = rgba(0, 122, 255, 0.26)
    fail_color = rgba(215, 0, 21, 0.26)
    fail_text = <span foreground="##ffffff">Try again</span>
    capslock_color = rgba(255, 149, 0, 0.26)
    rounding = 16
    position = 0, -36
    halign = center
    valign = center
}
